[project]
name = "binaural-localization-cnn"
version = "0.1.0"
description = "Binaural sound localization with the pretrained CNNs of Francl & McDermott (2022)"
readme = "README.md"
# TensorFlow 1.15 ships wheels only up to Python 3.7; pandas 1.3.5 needs >= 3.7.1.
requires-python = ">=3.7.1,<3.8"

# Packages imported directly by the blcnn package and the legacy/ scripts.
# Transitive dependencies are pinned in uv.lock, not here.
dependencies = [
    "tensorflow==1.15.5",
    "numpy==1.18.5",
    "scipy==1.4.1",
    "matplotlib==3.5.3",
    "pyfftw==0.13.0",      # pycochleagram
    "h5py==2.10.0",        # pycochleagram; h5py 3.x breaks TF 1.15 checkpoint/keras loading
    "protobuf==3.20.3",    # TF 1.15 fails with protobuf >= 4
    "toposort==1.10",      # legacy/memory_saving_gradients.py
    "soundfile==0.13.1",   # blcnn audio input (24-bit WAV, FLAC); bundles libsndfile
]

[project.scripts]
blcnn = "blcnn.cli:main"

[project.optional-dependencies]
# Used only by the scripts in legacy/analysis_and_plotting/.
# pip: pip install ".[analysis]"   uv: uv sync --extra analysis
analysis = [
    "pandas==1.3.5",
    "seaborn==0.12.2",
    "scikit-learn==1.0.2",
]
# Used only by `blcnn example` (renders example stimuli with the KEMAR HRTFs bundled in slab).
# pip: pip install ".[examples]"   uv: uv sync --extra examples
examples = [
    "slab==1.8.2",
]

[build-system]
# setuptools 68.0 is the last release supporting Python 3.7.
requires = ["setuptools>=61,<69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Installable package in src/blcnn; legacy/ is not installed.
where = ["src"]

[tool.uv]
# Resolve only for the platforms actually used (local Windows, Linux/SLURM cluster).
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "weights: needs the network weights (slow; skipped if weights/ is missing)",
]
filterwarnings = [
    # harmless: pyfftw's compiled extension was built against a newer numpy
    "ignore:numpy.ufunc size changed:RuntimeWarning",
]
