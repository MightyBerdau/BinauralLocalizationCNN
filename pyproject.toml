[project]
name = "binaural-localization-cnn"
version = "0.1.0"
description = "Binaural sound localization CNN (Francl & McDermott, 2022) - local CPU setup"
readme = "README.md"
# TensorFlow 1.15 ships wheels only up to Python 3.7; pandas 1.3.5 needs >= 3.7.1.
requires-python = ">=3.7.1,<3.8"

# Packages imported directly by the model / training / testing code.
# Transitive dependencies are pinned in uv.lock, not here.
dependencies = [
    "tensorflow==1.15.5",
    "numpy==1.18.5",
    "scipy==1.4.1",
    "matplotlib==3.5.3",
    "pyfftw==0.13.0",      # pycochleagram
    "h5py==2.10.0",        # pycochleagram; h5py 3.x breaks TF 1.15 checkpoint/keras loading
    "protobuf==3.20.3",    # TF 1.15 fails with protobuf >= 4
    "toposort==1.10",      # memory_saving_gradients.py
]

[project.optional-dependencies]
# Used only by the scripts in analysis_and_plotting/.
# pip: pip install ".[analysis]"   uv: uv sync --extra analysis
analysis = [
    "pandas==1.3.5",
    "seaborn==0.12.2",
    "scikit-learn==1.0.2",
]

[build-system]
# setuptools 68.0 is the last release supporting Python 3.7.
requires = ["setuptools>=61,<69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This repo is a collection of scripts, not an installable package:
# "pip install ." installs only the dependencies.
packages = []
py-modules = []

[tool.uv]
package = false
# Resolve only for the platforms actually used (local Windows, Linux/SLURM cluster).
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
